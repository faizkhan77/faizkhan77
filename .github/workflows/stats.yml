name: Update stats cards

on:
  schedule:
    - cron: "0 0 * * *"   # refresh daily
  workflow_dispatch:      # manual "Run workflow" button

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - name: Generate stats card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=faizkhan77&show_icons=true&include_all_commits=true&theme=tokyonight&hide_border=true&hide_title=true&bg_color=00000000
          path: profile/stats.svg
          token: ${{ secrets.STATS_TOKEN }}

      - name: Generate top languages card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=faizkhan77&layout=compact&langs_count=8&theme=tokyonight&hide_border=true&hide_title=true&bg_color=00000000
          path: profile/top-langs.svg
          token: ${{ secrets.STATS_TOKEN }}

      - name: Commit cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          git commit -m "Update stats cards" || exit 0
          git push
